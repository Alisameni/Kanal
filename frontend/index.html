<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="کانال — رابط گفت‌وگوی شخصی" />
    <title>کانال — چت‌بات شخصی</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before the first paint so the UI never flashes
      // the wrong colour scheme. Kept in sync with src/hooks/useTheme.ts.
      (function () {
        var theme = 'dark'
        try {
          var stored = window.localStorage.getItem('kanal-theme')
          if (stored === 'light' || stored === 'dark') {
            theme = stored
          }
        } catch (error) {
          /* storage unavailable: fall back to the default dark theme */
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
